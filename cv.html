<title>Sameer Neupane | CV</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="stylesheet" href="assets/css/main.css" />

<style>
:root {
    --bg1:#f4f7fb;
    --bg2:#eef2ff;
    --card:rgba(255,255,255,0.85);
    --text:#1f2937;
    --muted:#64748b;
    --primary:#2563eb;
    --shadow:0 20px 50px rgba(15,23,42,0.12);
}

body {
    background:
        radial-gradient(circle at top left, rgba(37,99,235,0.08), transparent 30%),
        radial-gradient(circle at top right, rgba(99,102,241,0.08), transparent 25%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
}

/* HEADER SAME AS INDEX */
#header {
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.75);
    border-bottom:1px solid rgba(255,255,255,0.35);
    box-shadow:0 8px 24px rgba(0,0,0,0.05);
}

#header .logo a,
#header .logo span,
#header #nav a {
    color:#1f2937 !important;
}

#header #nav a:hover {
    color:var(--primary) !important;
}

/* PAGE */
.cv-container {
    max-width:1100px;
    margin:auto;
    padding:100px 20px 40px;
}

/* HERO */
.hero {
    background:var(--card);
    padding:25px;
    border-radius:18px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
}

.hero h1 {
    font-size:2.5rem;
    margin-bottom:10px;
}

.hero p {
    color:var(--muted);
}

/* BUTTONS */
.actions {
    margin-bottom:20px;
}

.btn {
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    text-decoration:none;
    font-weight:600;
    margin-right:10px;
}

.btn-primary {
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
}

.btn-secondary {
    background:white;
    border:1px solid #ddd;
    color:#1f2937;
}

/* PDF VIEWER */
.pdf-wrapper {
    width:100%;
    height:85vh;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
    background:white;
}

.pdf-wrapper iframe {
    width:100%;
    height:100%;
    border:none;
}

/* MOBILE */
@media (max-width:640px){
    .cv-container {
        padding:80px 10px;
    }

    .hero h1 {
        font-size:2rem;
    }

    .pdf-wrapper {
        height:75vh;
    }
}
</style>

</head>

<body>

<!-- HEADER -->
<header id="header">
    <div class="logo">
        <a href="index.html">Sameer Neupane</a>
        <span>
            The <a href="https://techlab.ucsf.edu/" target="_blank">UCSF TECH Lab</a>
            at <a href="https://www.ucsf.edu/" target="_blank">UCSF</a>
        </span>
    </div>

    <nav id="nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="activities.html">Research Activities</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="hobby.html">Hobby</a></li>
            <li><a href="cv.html">CV</a></li>
            <li><a href="Publications.html">Publications</a></li>
        </ul>
    </nav>
</header>

<!-- PAGE -->
<div class="cv-container">

    <div class="hero">
        <h1>Curriculum Vitae</h1>
        <p>View or download my full academic CV below.</p>
    </div>

    <div class="actions">
        <a class="btn btn-primary" href="files/Sameer_neupane_resume.pdf" target="_blank">
            Open PDF
        </a>

        <a class="btn btn-secondary" href="files/Sameer_neupane_resume.pdf" download>
            Download CV
        </a>
    </div>

    <div class="pdf-wrapper">
        <iframe src="files/Sameer_neupane_resume.pdf"></iframe>
    </div>

</div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/main.js"></script>

</body>
</html>
